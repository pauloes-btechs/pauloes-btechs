name: Activity tracker

# Regenerates the stats / languages / heatmap / latest-commits cards and the
# contribution snake, then publishes them to the `output` branch, which the
# README embeds via raw.githubusercontent.com. With a GH_PAT secret present the
# numbers include private repos (names/messages stay masked); without it, the
# built-in GITHUB_TOKEN gives public-only numbers.

on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: tracker
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build stat cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}          # optional: personal token → private repos counted
          GH_USER: ${{ github.repository_owner }}
          OUT_DIR: dist
        run: python3 scripts/build_stats.py

      - name: Build contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#F7931A&color_dots=#101A30,#3A2A14,#8A5010,#C7761A,#F7931A
            dist/github-snake.svg?palette=github-light

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          jekyll: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
