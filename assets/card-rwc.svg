  </pattern>
  <radialGradient id="glow" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#F7931A" stop-opacity="0.35"/>
    <stop offset="100%" stop-color="#F7931A" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="fade" x1="0" x2="1" y1="0" y2="0">
    <stop offset="0%" stop-color="#080D1A" stop-opacity="0"/>
    <stop offset="100%" stop-color="#080D1A" stop-opacity="1"/>
  </linearGradient>
</defs>
<rect x="0.5" y="0.5" width="579" height="269" rx="14" fill="#0C1324" stroke="#1E2A40"/>
<rect x="0.5" y="0.5" width="579" height="269" rx="14" fill="url(#grid)"/>
<rect x="0" y="0" width="5" height="270" rx="2" fill="#5B8DEF"/>
<text x="28" y="40" font-family="'SFMono-Regular',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11" letter-spacing="2.5" fill="#5B8DEF">MUSIC  ·  ART SITE  ·  BITCOIN COMMERCE</text>
<g font-family="'SFMono-Regular',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="10.5" letter-spacing="2">
  <circle cx="455.5" cy="36" r="3.5" fill="#5B8DEF">
