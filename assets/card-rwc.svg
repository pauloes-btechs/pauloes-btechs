<text x="28" y="80" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="26" font-weight="700" fill="#E2E8F0" letter-spacing="-0.5">Robots Will Cry</text>
<text x="28" y="118" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14.5" fill="#94A3B8">Cinematic boot sequence into a scrolling page-world</text><text x="28" y="140" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14.5" fill="#94A3B8">for an EP release. DSP rail, sticky player, and a</text><text x="28" y="162" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14.5" fill="#94A3B8">BTCPay-powered shop with checkout.</text>
