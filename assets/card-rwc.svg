<svg xmlns="http://www.w3.org/2000/svg" width="580" height="270" viewBox="0 0 580 270" role="img" aria-label="Robots Will Cry">
<defs>
  <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
